apiVersion: 1
groups:
  - orgId: 1
    name: smakosz-host
    folder: Smakosz
    interval: 1m
    rules:
      - uid: node_disk_high
        title: NodeDiskHigh
        condition: B
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange:
              from: 600
              to: 0
            model:
              expr: '100 - ((node_filesystem_avail_bytes{mountpoint="/",fstype!="rootfs"} * 100) / node_filesystem_size_bytes{mountpoint="/",fstype!="rootfs"})'
              instant: true
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params: [85]
                    type: gt
                  operator:
                    type: and
                  query:
                    params: [A]
                  reducer:
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              refId: B
              type: threshold
        noDataState: OK
        execErrState: Alerting
        for: 10m
        annotations:
          __dashboardUid__: xfpJB9FGz
          __panelId__: "174"
          summary: "Disk usage above 85% on {{ $labels.host }}"
          description: "Root filesystem usage exceeded 85% threshold"
        labels:
          severity: warning
          category: infra
        isPaused: false

      - uid: node_ram_high
        title: NodeRAMHigh
        condition: B
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange:
              from: 600
              to: 0
            model:
              expr: '100 - ((node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) * 100)'
              instant: true
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params: [90]
                    type: gt
                  operator:
                    type: and
                  query:
                    params: [A]
                  reducer:
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              refId: B
              type: threshold
        noDataState: OK
        execErrState: Alerting
        for: 5m
        annotations:
          __dashboardUid__: xfpJB9FGz
          __panelId__: "156"
          summary: "RAM usage above 90% on {{ $labels.host }}"
          description: "Memory usage exceeded 90% threshold"
        labels:
          severity: warning
          category: infra

      - uid: node_cpu_high
        title: NodeCPUHigh
        condition: B
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange:
              from: 600
              to: 0
            model:
              expr: '100 - (avg by (instance) (irate(node_cpu_seconds_total{mode="idle"}[5m])) * 100)'
              instant: true
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params: [95]
                    type: gt
                  operator:
                    type: and
                  query:
                    params: [A]
                  reducer:
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              refId: B
              type: threshold
        noDataState: OK
        execErrState: Alerting
        for: 5m
        annotations:
          __dashboardUid__: xfpJB9FGz
          __panelId__: "7"
          summary: "CPU usage above 95% on {{ $labels.host }}"
          description: "CPU usage exceeded 95% threshold"
        labels:
          severity: warning
          category: infra

      - uid: node_load_high
        title: NodeLoadHigh
        condition: B
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange:
              from: 600
              to: 0
            model:
              expr: 'node_load5'
              instant: true
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params: [4]
                    type: gt
                  operator:
                    type: and
                  query:
                    params: [A]
                  reducer:
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              refId: B
              type: threshold
        noDataState: OK
        execErrState: Alerting
        for: 5m
        annotations:
          __dashboardUid__: xfpJB9FGz
          __panelId__: "13"
          summary: "Load average above 4 on {{ $labels.host }}"
          description: "5-minute load average exceeded 4.0 threshold"
        labels:
          severity: warning
          category: infra

      - uid: node_swap_high
        title: NodeSwapHigh
        condition: B
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange:
              from: 600
              to: 0
            model:
              expr: '100 - ((node_memory_SwapFree_bytes / node_memory_SwapTotal_bytes) * 100)'
              instant: true
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params: [50]
                    type: gt
                  operator:
                    type: and
                  query:
                    params: [A]
                  reducer:
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              refId: B
              type: threshold
        noDataState: OK
        execErrState: Alerting
        for: 10m
        annotations:
          __dashboardUid__: xfpJB9FGz
          __panelId__: "156"
          summary: "Swap usage above 50% on {{ $labels.host }}"
          description: "Swap memory usage exceeded 50% threshold"
        labels:
          severity: warning
          category: infra

  - orgId: 1
    name: smakosz-security
    folder: Smakosz
    interval: 1m
    rules:
      - uid: auth_login_failures_burst
        title: AuthLoginFailuresBurst
        condition: B
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange:
              from: 600
              to: 0
            model:
              expr: 'rate(app_logins_total{outcome="wrong_password"}[1m]) * 60'
              instant: true
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params: [10]
                    type: gt
                  operator:
                    type: and
                  query:
                    params: [A]
                  reducer:
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              refId: B
              type: threshold
        noDataState: OK
        execErrState: Alerting
        for: 5m
        annotations:
          __dashboardUid__: smakosz-security
          summary: "Brute force suspected: more than 10 failed logins per minute"
          description: "Failed login rate exceeded 10/min for 5 minutes. Investigate top source IPs in /admin/security-logs."
        labels:
          severity: warning
          category: security
        isPaused: false

      - uid: auth_lockout_spike
        title: AuthLockoutSpike
        condition: B
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange:
              from: 900
              to: 0
            model:
              expr: 'sum(increase(app_logins_total{outcome="account_locked"}[15m]))'
              instant: true
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params: [5]
                    type: gt
                  operator:
                    type: and
                  query:
                    params: [A]
                  reducer:
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              refId: B
              type: threshold
        noDataState: OK
        execErrState: Alerting
        for: 5m
        annotations:
          __dashboardUid__: smakosz-security
          summary: "Lockout spike: more than 5 accounts locked in 15 minutes"
          description: "Coordinated attack suspected. Multiple accounts hit lockout threshold in a short window."
        labels:
          severity: critical
          category: security
        isPaused: false

      - uid: auth_captcha_abuse
        title: AuthCaptchaAbuse
        condition: B
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange:
              from: 600
              to: 0
            model:
              expr: 'sum(increase(app_logins_total{outcome="captcha_failed"}[10m])) + sum(increase(app_registrations_total{outcome="captcha_failed"}[10m]))'
              instant: true
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params: [20]
                    type: gt
                  operator:
                    type: and
                  query:
                    params: [A]
                  reducer:
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              refId: B
              type: threshold
        noDataState: OK
        execErrState: Alerting
        for: 5m
        annotations:
          __dashboardUid__: smakosz-security
          summary: "CAPTCHA abuse: more than 20 captcha failures in 10 minutes"
          description: "Automated bot suspected. CAPTCHA failure rate combined across login and register exceeded threshold."
        labels:
          severity: warning
          category: security
        isPaused: false
