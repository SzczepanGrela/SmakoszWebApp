name: E2E (manual)

on:
  workflow_dispatch:

jobs:
  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 45

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: Czteryzera
          POSTGRES_DB: smakosz_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore Smakosz.slnx

      - name: Build
        run: dotnet build Smakosz.slnx --no-restore -c Release

      - name: Generate test JWT keypair and E2E test config
        run: |
          openssl genpkey -algorithm RSA -out /tmp/jwt_private.pem -pkeyopt rsa_keygen_bits:2048
          openssl rsa -in /tmp/jwt_private.pem -pubout -out /tmp/jwt_public.pem
          PRIVATE_KEY=$(awk 'NF {sub(/\r/,""); printf "%s\\n", $0}' /tmp/jwt_private.pem)
          mkdir -p tests/Smakosz.E2E/bin/Release/net10.0
          cat > tests/Smakosz.E2E/bin/Release/net10.0/appsettings.json <<EOF
          {
            "ConnectionStrings": {
              "E2E": "Host=localhost;Port=5432;Database=smakosz_e2e;Username=postgres;Password=Czteryzera"
            },
            "Jwt": {
              "PrivateKey": "${PRIVATE_KEY}"
            }
          }
          EOF

      - name: Install Playwright browsers
        run: pwsh tests/Smakosz.E2E/bin/Release/net10.0/playwright.ps1 install --with-deps chromium

      - name: Run E2E tests
        run: dotnet test tests/Smakosz.E2E/Smakosz.E2E.csproj --no-build -c Release --logger "trx;LogFileName=e2e.trx" --results-directory tests/Smakosz.E2E/TestResults
        env:
          ASPNETCORE_ENVIRONMENT: E2E
          Jwt__PrivateKeyPath: /tmp/jwt_private.pem
          Jwt__PublicKeyPath: /tmp/jwt_public.pem
          Jwt__Issuer: Smakosz.API
          Jwt__Audience: Smakosz.Client
          CodeHasher__Secret: ci-test-codehasher-secret-32chars-min
          Cors__AllowedOrigins__0: http://localhost:5003
          Turnstile__SiteKey: 1x00000000000000000000AA
          Turnstile__SecretKey: 1x0000000000000000000000000000000AA

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-results
          path: |
            tests/Smakosz.E2E/TestResults/**
            tests/Smakosz.E2E/playwright-traces/**
          retention-days: 7
