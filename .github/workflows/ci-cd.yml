name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/szczepangrela/smakoszwebapp

jobs:
  changes:
    name: Detect path changes
    runs-on: ubuntu-latest
    outputs:
      rbpi-gateway: ${{ steps.filter.outputs.rbpi-gateway }}
      gpu-worker: ${{ steps.filter.outputs.gpu-worker }}
      api: ${{ steps.filter.outputs.api }}
      client: ${{ steps.filter.outputs.client }}
      orchestrator: ${{ steps.filter.outputs.orchestrator }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Find last successful run as path-filter base
        id: find-base
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SHA=$(gh run list \
            --workflow ci-cd.yml \
            --branch ${{ github.ref_name }} \
            --status success \
            --event push \
            --limit 1 \
            --json headSha \
            --jq '.[0].headSha // ""')
          if [ -z "$SHA" ]; then
            SHA="${{ github.event.before }}"
            echo "No previous successful run found, falling back to event.before: $SHA"
          else
            echo "Using last green run SHA as base: $SHA"
          fi
          echo "base=$SHA" >> "$GITHUB_OUTPUT"

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          base: ${{ steps.find-base.outputs.base }}
          filters: |
            rbpi-gateway:
              - 'tools/rbpi-gateway/**'
              - 'infra/rbpi/**'
              - 'infra/scripts/deploy-rbpi.sh'
            gpu-worker:
              - 'gpu-worker/**'
            api:
              - 'src/Smakosz.API/**'
              - 'src/Smakosz.Application/**'
              - 'src/Smakosz.Domain/**'
              - 'src/Smakosz.Infrastructure/**'
              - 'Smakosz.slnx'
              - 'docker-compose.yml'
              - 'infra/grafana/**'
              - 'infra/prometheus/**'
              - 'infra/scripts/deploy.sh'
              - '.github/workflows/ci-cd.yml'
            client:
              - 'src/Smakosz.Client/**'
              - 'src/Smakosz.Client.Shared/**'
              - 'src/Smakosz.Client.Ops/**'
              - 'Smakosz.slnx'
              - 'docker-compose.yml'
              - '.github/workflows/ci-cd.yml'
            orchestrator:
              - 'src/Smakosz.Orchestrator/**'
              - 'src/Smakosz.Application/**'
              - 'src/Smakosz.Domain/**'
              - 'src/Smakosz.Infrastructure/**'
              - 'Smakosz.slnx'
              - 'docker-compose.yml'
              - '.github/workflows/ci-cd.yml'

  test-rbpi-gateway:
    name: Test RBPI Gateway
    needs: [changes]
    if: |
      (github.event_name == 'workflow_dispatch') ||
      (needs.changes.outputs.rbpi-gateway == 'true')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/rbpi-gateway
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            tools/rbpi-gateway/requirements.txt
            tools/rbpi-gateway/requirements-dev.txt

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Ruff
        run: ruff check .

      - name: Mypy
        run: mypy .

      - name: Pytest
        run: pytest tests/

  test-gpu-worker:
    name: Test GPU Worker
    needs: [changes]
    if: |
      (github.event_name == 'workflow_dispatch') ||
      (needs.changes.outputs.gpu-worker == 'true')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gpu-worker
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: |
            gpu-worker/requirements.txt
            gpu-worker/requirements-dev.txt

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Ruff
        run: ruff check .

      - name: Mypy
        run: mypy .

      - name: Pytest
        run: pytest tests/

  test-smakosz-unit:
    name: Test Smakosz Unit
    needs: [changes]
    if: |
      (github.event_name == 'workflow_dispatch') ||
      (needs.changes.outputs.api == 'true') ||
      (needs.changes.outputs.client == 'true') ||
      (needs.changes.outputs.orchestrator == 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', 'Smakosz.slnx') }}
          restore-keys: ${{ runner.os }}-nuget-

      - name: Restore
        run: dotnet restore Smakosz.slnx

      - name: Build
        run: dotnet build Smakosz.slnx --no-restore -c Release

      - name: Unit Tests
        run: dotnet test tests/Smakosz.UnitTests/Smakosz.UnitTests.csproj --no-build -c Release
        env:
          ASPNETCORE_ENVIRONMENT: Production

  test-smakosz-client:
    name: Test Smakosz Client
    needs: [changes]
    if: |
      (github.event_name == 'workflow_dispatch') ||
      (needs.changes.outputs.api == 'true') ||
      (needs.changes.outputs.client == 'true') ||
      (needs.changes.outputs.orchestrator == 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', 'Smakosz.slnx') }}
          restore-keys: ${{ runner.os }}-nuget-

      - name: Restore
        run: dotnet restore Smakosz.slnx

      - name: Build
        run: dotnet build Smakosz.slnx --no-restore -c Release

      - name: Client Tests
        run: dotnet test tests/Smakosz.ClientTests/Smakosz.ClientTests.csproj --no-build -c Release
        env:
          ASPNETCORE_ENVIRONMENT: Production

  test-smakosz-integration:
    name: Test Smakosz Integration
    needs: [changes]
    if: |
      (github.event_name == 'workflow_dispatch') ||
      (needs.changes.outputs.api == 'true') ||
      (needs.changes.outputs.client == 'true') ||
      (needs.changes.outputs.orchestrator == 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', 'Smakosz.slnx') }}
          restore-keys: ${{ runner.os }}-nuget-

      - name: Restore
        run: dotnet restore Smakosz.slnx

      - name: Build
        run: dotnet build Smakosz.slnx --no-restore -c Release

      - name: Integration Tests
        run: dotnet test tests/Smakosz.IntegrationTests/Smakosz.IntegrationTests.csproj --no-build -c Release
        env:
          ASPNETCORE_ENVIRONMENT: Testing

  build-rbpi-gateway:
    name: Build & Push RBPI Gateway
    needs: [test-rbpi-gateway, changes]
    if: |
      (github.event_name == 'workflow_dispatch') ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.changes.outputs.rbpi-gateway == 'true')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set short SHA
        run: echo "SHORT_SHA=${GITHUB_SHA::7}" >> $GITHUB_ENV

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push arm64 image
        uses: docker/build-push-action@v6
        with:
          context: tools/rbpi-gateway
          file: tools/rbpi-gateway/Dockerfile
          platforms: linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/rbpi-gateway:latest
            ${{ env.IMAGE_PREFIX }}/rbpi-gateway:${{ env.SHORT_SHA }}
          cache-from: type=gha,scope=rbpi-gateway
          cache-to: type=gha,mode=max,scope=rbpi-gateway

  build-gpu-worker:
    name: Build & Push GPU Worker
    needs: [test-gpu-worker, changes]
    if: |
      (github.event_name == 'workflow_dispatch') ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.changes.outputs.gpu-worker == 'true')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set short SHA
        run: echo "SHORT_SHA=${GITHUB_SHA::7}" >> $GITHUB_ENV

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push GPU Worker
        uses: docker/build-push-action@v6
        with:
          context: gpu-worker
          file: gpu-worker/Dockerfile.gpu
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/gpu-worker:latest
            ${{ env.IMAGE_PREFIX }}/gpu-worker:${{ env.SHORT_SHA }}
          cache-from: type=gha,scope=gpu-worker
          cache-to: type=gha,mode=max,scope=gpu-worker

  build-api:
    name: Build & Push API
    needs: [test-smakosz-unit, test-smakosz-client, test-smakosz-integration, changes]
    if: |
      (github.event_name == 'workflow_dispatch') ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.changes.outputs.api == 'true')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set short SHA
        run: echo "SHORT_SHA=${GITHUB_SHA::7}" >> $GITHUB_ENV

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push API
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/Smakosz.API/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/api:latest
            ${{ env.IMAGE_PREFIX }}/api:${{ env.SHORT_SHA }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

  build-client:
    name: Build & Push Client
    needs: [test-smakosz-unit, test-smakosz-client, test-smakosz-integration, changes]
    if: |
      (github.event_name == 'workflow_dispatch') ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.changes.outputs.client == 'true')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set short SHA
        run: echo "SHORT_SHA=${GITHUB_SHA::7}" >> $GITHUB_ENV

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push Client
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/Smakosz.Client/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/client:latest
            ${{ env.IMAGE_PREFIX }}/client:${{ env.SHORT_SHA }}
          cache-from: type=gha,scope=client
          cache-to: type=gha,mode=max,scope=client

  build-orchestrator:
    name: Build & Push Orchestrator
    needs: [test-smakosz-unit, test-smakosz-client, test-smakosz-integration, changes]
    if: |
      (github.event_name == 'workflow_dispatch') ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.changes.outputs.orchestrator == 'true')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set short SHA
        run: echo "SHORT_SHA=${GITHUB_SHA::7}" >> $GITHUB_ENV

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push Orchestrator
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/Smakosz.Orchestrator/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/orchestrator:latest
            ${{ env.IMAGE_PREFIX }}/orchestrator:${{ env.SHORT_SHA }}
          cache-from: type=gha,scope=orchestrator
          cache-to: type=gha,mode=max,scope=orchestrator

  deploy-vps:
    name: Deploy to VPS
    needs: [build-api, build-client, build-orchestrator]
    if: |
      always() &&
      (needs.build-api.result == 'success' || needs.build-client.result == 'success' || needs.build-orchestrator.result == 'success') &&
      needs.build-api.result != 'failure' && needs.build-api.result != 'cancelled' &&
      needs.build-client.result != 'failure' && needs.build-client.result != 'cancelled' &&
      needs.build-orchestrator.result != 'failure' && needs.build-orchestrator.result != 'cancelled'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-vps
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_CLIENT_ID_VPS }}
          audience: ${{ secrets.TS_AUDIENCE_VPS }}
          tags: tag:ci-vps

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY_VPS }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p ${{ secrets.VPS_SSH_PORT }} ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: Deploy & verify health
        run: |
          ssh -o IdentitiesOnly=yes -i ~/.ssh/deploy_key \
            -p ${{ secrets.VPS_SSH_PORT }} \
            smakosz@${{ secrets.VPS_HOST }}

  deploy-rbpi:
    name: Deploy to RBPI
    needs: [build-rbpi-gateway, changes]
    if: |
      (github.event_name == 'workflow_dispatch') ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.changes.outputs.rbpi-gateway == 'true')
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-rbpi
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_CLIENT_ID_RBPI }}
          audience: ${{ secrets.TS_AUDIENCE_RBPI }}
          tags: tag:ci-rbpi

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY_RBPI }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          for i in 1 2 3 4 5; do
            if ssh-keyscan -p ${{ secrets.RBPI_SSH_PORT }} ${{ secrets.RBPI_HOST }} >> ~/.ssh/known_hosts 2>&1; then
              echo "ssh-keyscan succeeded on attempt $i"
              exit 0
            fi
            echo "ssh-keyscan attempt $i failed, retrying in 5s..."
            sleep 5
          done
          echo "ssh-keyscan failed after 5 attempts"
          exit 1

      - name: Deploy
        run: |
          ssh -i ~/.ssh/deploy_key -p ${{ secrets.RBPI_SSH_PORT }} \
            smakosz@${{ secrets.RBPI_HOST }} bash /home/smakosz/deploy-launcher.sh

      - name: Health check via Tailscale
        run: |
          for i in 1 2 3; do
            if curl -fsS --max-time 5 "http://${{ secrets.RBPI_HOST }}:5000/health"; then
              echo "Health check OK"
              exit 0
            fi
            echo "Attempt $i failed, retrying in 5s..."
            sleep 5
          done
          echo "Health check failed after 3 attempts"
          exit 1

  cf-purge:
    name: Purge Cloudflare cache
    needs: [deploy-vps]
    if: always() && needs.deploy-vps.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Purge frontend Cloudflare cache
        run: |
          curl -fsS -X POST \
            "https://api.cloudflare.com/client/v4/zones/${{ secrets.CF_ZONE_ID }}/purge_cache" \
            -H "Authorization: Bearer ${{ secrets.CF_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            --data '{"hosts":["smakosz.xyz"]}'
