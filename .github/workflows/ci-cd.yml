name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/szczepangrela/smakoszwebapp

jobs:
  test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore Smakosz.slnx

      - name: Build
        run: dotnet build Smakosz.slnx --no-restore -c Release

      - name: Unit Tests
        run: dotnet test tests/Smakosz.UnitTests/Smakosz.UnitTests.csproj --no-build -c Release

      - name: Client Tests
        run: dotnet test tests/Smakosz.ClientTests/Smakosz.ClientTests.csproj --no-build -c Release

      - name: Integration Tests
        run: dotnet test tests/Smakosz.IntegrationTests/Smakosz.IntegrationTests.csproj --no-build -c Release
        env:
          ASPNETCORE_ENVIRONMENT: Testing

  e2e:
    name: E2E Tests
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: Czteryzera
          POSTGRES_DB: smakosz_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore Smakosz.slnx

      - name: Build
        run: dotnet build Smakosz.slnx --no-restore -c Release

      - name: Install Playwright browsers
        run: pwsh tests/Smakosz.E2E/bin/Release/net10.0/playwright.ps1 install --with-deps chromium

      - name: Run E2E tests
        run: dotnet test tests/Smakosz.E2E/Smakosz.E2E.csproj --no-build -c Release --logger "trx;LogFileName=e2e.trx" --results-directory tests/Smakosz.E2E/TestResults
        env:
          ASPNETCORE_ENVIRONMENT: E2E

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-results
          path: |
            tests/Smakosz.E2E/TestResults/**
            tests/Smakosz.E2E/playwright-traces/**
          retention-days: 7

  build-images:
    name: Build & Push Images
    needs: [test, e2e]
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set short SHA
        run: echo "SHORT_SHA=${GITHUB_SHA::7}" >> $GITHUB_ENV

      - name: Build & push API
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/Smakosz.API/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/api:latest
            ${{ env.IMAGE_PREFIX }}/api:${{ env.SHORT_SHA }}

      - name: Build & push Client
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/Smakosz.Client/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/client:latest
            ${{ env.IMAGE_PREFIX }}/client:${{ env.SHORT_SHA }}

      - name: Build & push Orchestrator
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/Smakosz.Orchestrator/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/orchestrator:latest
            ${{ env.IMAGE_PREFIX }}/orchestrator:${{ env.SHORT_SHA }}

      - name: Build & push GPU Worker
        uses: docker/build-push-action@v6
        with:
          context: gpu-worker
          file: gpu-worker/Dockerfile.gpu
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/gpu-worker:latest
            ${{ env.IMAGE_PREFIX }}/gpu-worker:${{ env.SHORT_SHA }}

  deploy-vps:
    name: Deploy to VPS
    needs: build-images
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-vps
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_CLIENT_ID_VPS }}
          audience: ${{ secrets.TS_AUDIENCE_VPS }}
          tags: tag:ci-vps

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY_VPS }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p ${{ secrets.VPS_SSH_PORT }} ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: Deploy & verify health
        run: |
          ssh -i ~/.ssh/deploy_key -p ${{ secrets.VPS_SSH_PORT }} \
            smakosz@${{ secrets.VPS_HOST }} bash /home/smakosz/deploy-launcher.sh
