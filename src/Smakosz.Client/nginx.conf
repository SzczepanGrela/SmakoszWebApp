server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets
    location ~* \.(js|css|wasm|dll|dat|blat|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Disable caching for index.html (SPA entry point)
    location = /index.html {
        expires -1;
        add_header Cache-Control "no-cache";
    }

    # Disable caching for appsettings (overridden at runtime via volume mount)
    location ~* appsettings.*\.json$ {
        expires -1;
        add_header Cache-Control "no-cache";
    }
}
