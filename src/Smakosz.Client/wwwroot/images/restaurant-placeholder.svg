<svg xmlns="http://www.w3.org/2000/svg" width="400" height="300" viewBox="0 0 400 300">
  <rect width="400" height="300" fill="#F3F0EB"/>
  <g transform="translate(200,120)" fill="none" stroke="#C4B8A8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- building -->
    <rect x="-40" y="-30" width="80" height="60" rx="3"/>
    <!-- door -->
    <rect x="-10" y="5" width="20" height="25"/>
    <!-- windows -->
    <rect x="-32" y="-20" width="16" height="14" rx="2"/>
    <rect x="16" y="-20" width="16" height="14" rx="2"/>
    <!-- awning -->
    <path d="M-45,-30 L-45,-38 Q-30,-30 -15,-38 Q0,-30 15,-38 Q30,-30 45,-38 L45,-30"/>
    <!-- sign -->
    <line x1="-20" y1="-45" x2="20" y2="-45"/>
  </g>
  <text x="200" y="200" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" fill="#A0937D">Brak zdjecia restauracji</text>
</svg>
