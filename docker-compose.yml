services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: smakosz_db
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"

  api:
    image: ghcr.io/szczepangrela/smakoszwebapp/api:latest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
    volumes:
      - ./config/api-appsettings.json:/app/appsettings.json:ro
      - ./keys:/app/keys:ro
      - ncf-models:/models/ncf:ro
    ports:
      - "127.0.0.1:5000:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/health/live || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  orchestrator:
    image: ghcr.io/szczepangrela/smakoszwebapp/orchestrator:latest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
    volumes:
      - ./config/orchestrator-appsettings.json:/app/appsettings.json:ro
      - ncf-models:/models/ncf
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "${TAILSCALE_IP}:8081:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/health/live || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  client:
    image: ghcr.io/szczepangrela/smakoszwebapp/client:latest
    restart: unless-stopped
    volumes:
      - ./config/client-appsettings.json:/usr/share/nginx/html/appsettings.json:ro
    ports:
      - "127.0.0.1:5003:80"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:80/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"

  node_exporter:
    image: prom/node-exporter:v1.9.1
    container_name: smakosz-node-exporter
    restart: unless-stopped
    pid: host
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--path.rootfs=/host/root'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
      - '--collector.netclass.ignored-devices=^(veth.*|docker.*|br-.*|lo)$$'
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/host/root:ro,rslave
    deploy:
      resources:
        limits:
          memory: 64M
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"

  prometheus:
    image: prom/prometheus:v3.5.1
    container_name: smakosz-prometheus
    restart: unless-stopped
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--web.enable-lifecycle'
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    deploy:
      resources:
        limits:
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"

  grafana:
    image: grafana/grafana:13.0.1
    container_name: smakosz-grafana
    restart: unless-stopped
    ports:
      - "${TAILSCALE_IP}:3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SERVER_ROOT_URL: http://${TAILSCALE_IP}:3000
      GF_SMTP_ENABLED: "true"
      GF_SMTP_HOST: smtp-relay.brevo.com:587
      GF_SMTP_USER: ${BREVO_SMTP_USER}
      GF_SMTP_PASSWORD: ${BREVO_SMTP_PASSWORD}
      GF_SMTP_FROM_ADDRESS: grafana@smakosz.xyz
      GF_SMTP_FROM_NAME: Grafana
      GF_SMTP_STARTTLS_POLICY: MandatoryStartTLS
      GF_RENDERING_SERVER_URL: http://grafana_image_renderer:8081/render
      GF_RENDERING_CALLBACK_URL: http://grafana:3000/
      GF_RENDERING_RENDERER_TOKEN: ${GRAFANA_RENDERER_TOKEN}
      GF_LOG_FILTERS: rendering:info
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    deploy:
      resources:
        limits:
          memory: 768M
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"

  grafana_image_renderer:
    image: grafana/grafana-image-renderer:3.12.9
    container_name: smakosz-grafana-renderer
    restart: unless-stopped
    environment:
      ENABLE_METRICS: "true"
      HTTP_HOST: 0.0.0.0
      HTTP_PORT: "8081"
      AUTH_TOKEN: ${GRAFANA_RENDERER_TOKEN}
    deploy:
      resources:
        limits:
          memory: 512M
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"

volumes:
  pgdata:
  ncf-models:
  prometheus_data:
  grafana_data:

networks:
  default:
    name: smakosz_network
    external: true
