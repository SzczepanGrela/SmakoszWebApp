services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: smakosz_db
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"

  api:
    image: ghcr.io/szczepangrela/smakoszwebapp/api:latest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
    volumes:
      - ./config/api-appsettings.json:/app/appsettings.json:ro
      - ncf-models:/models/ncf:ro
    ports:
      - "127.0.0.1:5000:8080"
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  orchestrator:
    image: ghcr.io/szczepangrela/smakoszwebapp/orchestrator:latest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
    volumes:
      - ./config/orchestrator-appsettings.json:/app/appsettings.json:ro
      - ncf-models:/models/ncf
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "127.0.0.1:8081:8080"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  client:
    image: ghcr.io/szczepangrela/smakoszwebapp/client:latest
    restart: unless-stopped
    volumes:
      - ./config/client-appsettings.json:/usr/share/nginx/html/appsettings.json:ro
    ports:
      - "127.0.0.1:5003:80"
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"

volumes:
  pgdata:
  ncf-models:

networks:
  default:
    name: smakosz_network
    external: true
